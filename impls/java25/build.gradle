plugins {
  id 'java'
  id 'application'
  id 'com.gradleup.shadow' version '9.6.1'
  id 'org.graalvm.buildtools.native' version '1.1.14'
}

group = 'com.github.tonivade'
 
repositories {
  mavenCentral()
}
 
java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
}
 
tasks.withType(JavaCompile) {
  options.compilerArgs << '-Xlint:unchecked'
  options.compilerArgs << '-Xlint:rawtypes'
  options.compilerArgs << "-Aproject=${project.group}/${project.name}"
  options.release = 25
}
 
dependencies {
  annotationProcessor 'info.picocli:picocli-codegen:4.7.7'

  implementation 'org.jline:jline-terminal-ffm:4.4.8'
  implementation 'org.jline:jline-reader:4.4.8'
  implementation 'info.picocli:picocli:4.7.7'
  implementation 'org.apache.commons:commons-text:1.15.0'
  implementation 'org.pcollections:pcollections:5.0.0'
 
  testImplementation platform("org.junit:junit-bom:6.1.3")
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  
  testImplementation platform('org.mockito:mockito-bom:5.24.0')
  testImplementation 'org.mockito:mockito-core'
  testImplementation 'org.mockito:mockito-junit-jupiter'
}

test {
  useJUnitPlatform()
}

application {
  mainClass = 'mal.App'
}

shadowJar {
  archiveFileName = 'mal.jar'
  manifest {
    attributes(
      'Main-Class': 'mal.App', 
      'Enable-Native-Access': 'ALL-UNNAMED'
    )
  }
}

graalvmNative {
  toolchainDetection = true
  binaries {
    main {
      imageName = "mal"
      mainClass = "mal.App"
      buildArgs.add("-O2")
      buildArgs.add('--verbose')
      buildArgs.add('--no-fallback')
    }
    test {
      buildArgs.add("-O0")
    }
  }
}
